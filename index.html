<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD - Jogadoras de futebol</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Cadastro de jogadoras</h1>
      <section class="controles">
        <input
          type="text"
          id="busca"
          placeholder="Buscar por nome ou posição..."
        />

        <select id="filtroClubes">
          <option value="">Todos os clubes</option>
        </select>

        <button id="ordenarNome">A-Z Nome</button>
        <button id="ordenarPosicao">A-Z Posição</button>
      </section>
    </header>
    <main>
      <!-- secao onde sera exibido o formulario de cadastro -->
      <section id="form-section"></section>

      <!-- secao onde serao exibidos os cards gerados atraves do javascript -->
      <section id="cards"></section>
    </main>
    <footer>
      <p>WebSite desenvolvido para o Checkpoint 4 - WebDev</p>
    </footer>
  </body>
  <script src="./app.js"></script>
</html>
