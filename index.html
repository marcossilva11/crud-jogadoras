<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD - Jogadoras de futebol</title>
    <!-- importe da fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- link css -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Cadastro de jogadoras</h1>
      <section class="controles">
        <input
          type="text"
          id="busca"
          placeholder="Buscar por nome ou posição..."
        />

        <select id="filtroClubes">
        </select>

        <div class="botoes-ordenacao">
          <button id="ordenarNome">A-Z Nome</button>
          <button id="ordenarPosicao">Goleira - Atacante</button>
        </div>
      </section>
    </header>
    <main>
      <button id="btn-adicionar">Adicionar jogadora</button>
      <!-- secao onde sera exibido o formulario de cadastro -->
      <section id="form-section">
        <h2 id="form-titulo">Adicionando uma jogadora</h2>
        <form id="form-jogadora">
          <div class="form-bloco">
            <h3>Informações básicas</h3>
            <div class="input-box">
              <label for="nome">Nome:</label>
              <input
                type="text"
                class="form-input"
                id="nome"
                name="nome"
                placeholder="Digite o nome"
              />
            </div>
            <div class="input-box">
              <label for="posicao">Posição:</label>
              <select class="form-input" name="posicao" id="posicao">
                <option value=""></option>
                <option value="Goleira">Goleira</option>
                <option value="Zagueira">Zagueira</option>
                <option value="Meio-campo">Meio-campo</option>
                <option value="Atacante">Atacante</option>
              </select>
            </div>
            <div class="input-box">
              <label for="clube">Clube:</label>
              <input
                type="text"
                class="form-input"
                name="clube"
                id="clube"
                placeholder="Digite o clube"
              />
            </div>
            <div class="input-box">
              <label for="foto">Imagem da jogadora (URL):</label>
              <input
                type="text"
                class="form-input"
                name="foto"
                id="foto"
                placeholder="Digite a URL da imagem"
              />
            </div>
          </div>
          <div class="form-bloco">
            <h3>Estatísticas</h3>
            <div class="input-box">
              <label for="gols">Número de gols:</label>
              <input
                type="number"
                class="form-input"
                name="gols"
                id="gols"
                placeholder="Digite o número de gols"
              />
            </div>
            <div class="input-box">
              <label for="assistencias">Número de assistências:</label>
              <input
                type="number"
                class="form-input"
                name="assistencias"
                id="assistencias"
                placeholder="Digite o número de assistências"
              />
            </div>
            <div class="input-box">
              <label for="jogos">Número de jogos:</label>
              <input
                type="number"
                class="form-input"
                name="jogos"
                id="jogos"
                placeholder="Digite o número de jogos"
              />
            </div>
          </div>
          <div class="form-buttons">
            <button type="submit" id="form-btn">Adicionar</button>
            <button type="button" id="form-cancelar">Cancelar</button>
          </div>
        </form>
      </section>

      <!-- secao onde serao exibidos os cards gerados atraves do javascript -->
      <h2>Jogadoras</h2>
      <section id="cards-section"></section>
    </main>
    <footer>
      <p>WebSite desenvolvido para o Checkpoint 4 - WebDev</p>
    </footer>
  </body>
  <script src="./app.js"></script>
  <!-- Icons -->
  <script
    src="https://kit.fontawesome.com/4dfc02e26e.js"
    crossorigin="anonymous"
  ></script>
</html>
